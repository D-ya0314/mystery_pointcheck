  <body>
    <header class="l_header js_header">
      <h1 class="l_header_logo">
        <p class="l_header_link">探偵手帳</p>
      </h1>
      <nav class="l_header-nav js_nav">
        <ul class="l_header-nav_list">
          <li class="l_header-nav_item">

        <span class="m_hamburger-bar"></span>
        <span class="m_hamburger-bar"></span>
      </button>
    </header>
    <main class="top_main">
      <div class="l_contents">
        <div class="l_container-sm">
          <p>ポイント確認</p>

          <p id="status">LINEのログイン状況確認</p>
        </div>

        <div id="result" style="display: none">
          <div class="l_container-sm">
            <p>現在のポイント</p>
            <p><span id="point">0</span> pt</p>

            <p>
              ランキング：
              <span id="rank">-</span>位 / <span id="totalUsers">-</span>人
            </p>
          </div>
          <div class="l_container-sm">
            <hr />

            <p>次の報酬</p>
            <p id="nextReward">-</p>
            <p id="nextPoint"></p>

            <hr />
          </div>
          <div class="l_container-sm">
            <p>🎁 解放済み特典</p>

            <div id="unlockedRewards">特典を確認中……</div>
          </div>
        </div>
      </div>
    </main>
